events {}

http {
  # Tamaño máximo de petición (para audios, más adelante)
  client_max_body_size 20m;

  server {
    listen 3000;

    # CORS: solo aquí, los servicios no lo tienen
    add_header Access-Control-Allow-Origin  "http://localhost:5173" always;
    add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

    # El navegador pregunta primero con OPTIONS; se responde aquí mismo
    if ($request_method = OPTIONS) {
      return 204;
    }

    # Rutas hacia los servicios (por ahora corren en la PC)
    location /api/auth {
      proxy_pass http://host.docker.internal:3002;
    }

    location /api/users {
      proxy_pass http://host.docker.internal:3001;
    }

    location /api/conversations {
      proxy_pass http://host.docker.internal:3003;
    }

    # Health del propio gateway
    location = /api/health {
      default_type application/json;
      return 200 '{"status":"ok","gateway":"nginx"}';
    }
  }
}
