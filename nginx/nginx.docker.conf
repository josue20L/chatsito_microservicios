events {}

http {
  # TamaÃ±o mÃ¡ximo de peticiÃ³n (para audios, mÃ¡s adelante)
  client_max_body_size 20m;

  server {
    listen 3000;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    set $users_upstream users-service:3001;
    set $auth_upstream auth-service:3002;
    set $conversations_upstream conversations-service:3003;
    set $messages_upstream messages-service:3004;
    set $media_upstream media-service:3005;
    set $notifications_upstream notifications-service:3006;

    # CORS: solo aquÃ­, los servicios no lo tienen
    add_header Access-Control-Allow-Origin  "http://localhost:5173" always;
    add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

    # El navegador pregunta primero con OPTIONS; se responde aquÃ­ mismo
    if ($request_method = OPTIONS) {
      return 204;
    }

    # Rutas hacia los servicios (por ahora corren en la PC)
    location /api/auth {
      error_page 502 504 =503 @auth_unavailable;
      proxy_pass http://$auth_upstream;
    }

    location /api/users {
      error_page 502 504 =503 @users_unavailable;
      proxy_pass http://$users_upstream;
    }

    location ~ ^/api/conversations/[^/]+/audio$ {
      error_page 502 504 =503 @media_unavailable;
      client_max_body_size 11m;
      proxy_pass http://$media_upstream;
    }

    location /api/conversations {
      error_page 502 504 =503 @conversations_unavailable;
      proxy_pass http://$conversations_upstream;
    }

    location ~ ^/api/conversations/[^/]+/messages {
      error_page 502 504 =503 @messages_unavailable;
      proxy_pass http://$messages_upstream;
    }

    location /api/messages {
      error_page 502 504 =503 @messages_unavailable;
      proxy_pass http://$messages_upstream;
    }

    location /api/media {
      error_page 502 504 =503 @media_unavailable;
      proxy_pass http://$media_upstream;
    }

    location /socket.io/ {
      proxy_pass http://$notifications_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    # Fallas de conexiÃ³n al upstream: no se interceptan errores de validaciÃ³n
    # ni respuestas 503 del servicio que identifican una dependencia caÃ­da.
    location @auth_unavailable {
      default_type application/json;
      return 503 '{"statusCode":503,"service":"auth-service","message":"auth-service no disponible"}';
    }
    location @users_unavailable {
      default_type application/json;
      return 503 '{"statusCode":503,"service":"users-service","message":"users-service no disponible"}';
    }
    location @conversations_unavailable {
      default_type application/json;
      return 503 '{"statusCode":503,"service":"conversations-service","message":"conversations-service no disponible"}';
    }
    location @messages_unavailable {
      default_type application/json;
      return 503 '{"statusCode":503,"service":"messages-service","message":"messages-service no disponible"}';
    }
    location @media_unavailable {
      default_type application/json;
      return 503 '{"statusCode":503,"service":"media-service","message":"media-service no disponible"}';
    }

    # Health del propio gateway
    location = /api/health {
      default_type application/json;
      return 200 '{"status":"ok","gateway":"nginx"}';
    }
  }
}

